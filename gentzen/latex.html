    }

    }

      display: block;
      counter-increment: def;
      margin-top: 1rem;

        <textarea id="editor" spellcheck="true" autofocus>\title{Countability and Cantor's Theorem}

\author{Author}

\abstract{These notes state the definition of a countable set and Cantor's theorem on the existence of uncountable sets.}

\section{Countable Sets}

\definition{A set $A$ is countable if either $A$ is finite, or there exists a bijection $$f:\mathbb{N} \to A.$$ Equivalently, the elements of $A$ can be listed as a sequence $$a_0,a_1,a_2,\ldots$$ possibly with repetitions.}

\theorem{There exists an uncountable set. In particular, the power set $\mathcal{P}(\mathbb{N})$ is uncountable, since $$\left|\mathcal{P}(\mathbb{N})\right| > \left|\mathbb{N}\right|.$$ This follows from Cantor's diagonal argument: for every function $f:\mathbb{N}\to\mathcal{P}(\mathbb{N})$, the set $$D=\{n\in\mathbb{N}: n\notin f(n)\}$$ is not equal to $f(k)$ for any $k\in\mathbb{N}$. Hence no such function is surjective.}</textarea>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <section class="pane">
        <div class="pane-title">
          <span class="pane-title-text">Preview</span>
          <button class="preview-language-button" id="previewLanguageButton" type="button" aria-label="Switch preview language">EN</button>
          <button class="save-button" id="savePdfButton" type="button" aria-label="Save as PDF">⎙</button>
        </div>
        <div id="preview" aria-live="polite"></div>
      </section>
    </div>

\\author{Author}

\\abstract{These notes state the definition of a countable set and Cantor's theorem on the existence of uncountable sets.}

\\section{Countable Sets}

\\definition{A set $A$ is countable if either $A$ is finite, or there exists a bijection $$f:\\mathbb{N} \\to A.$$ Equivalently, the elements of $A$ can be listed as a sequence $$a_0,a_1,a_2,\\ldots$$ possibly with repetitions.}

\\theorem{There exists an uncountable set. In particular, the power set $\\mathcal{P}(\\mathbb{N})$ is uncountable, since $$\\left|\\mathcal{P}(\\mathbb{N})\\right| > \\left|\\mathbb{N}\\right|.$$ This follows from Cantor's diagonal argument: for every function $f:\\mathbb{N}\\to\\mathcal{P}(\\mathbb{N})$, the set $$D=\\{n\\in\\mathbb{N}: n\\notin f(n)\\}$$ is not equal to $f(k)$ for any $k\\in\\mathbb{N}$. Hence no such function is surjective.}`
      },
      {
        key: "sequents",
        label: "Sequents",
        content: `\\title{Sequents}

\\author{Author}

\\abstract{A short example about sequents, identity, and notation.}

\\section{Sequent Calculus}

\\definition{A sequent has the form $$\\Gamma \\Rightarrow \\Delta$$ where $\\Gamma$ and $\\Delta$ are finite collections of formulas.}

\\theorem{If $A \\in \\Gamma$, then the sequent $$\\Gamma \\Rightarrow A$$ is derivable by the identity axiom.}

Axioms:

$$

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function toPersianDigits(text) {
      return text.replace(/[0-9]/g, function (digit) {
        return String.fromCharCode(0x06f0 + Number(digit));
      });
    }

    function convertDigitsOutsideMath(text, shouldConvert) {
      if (!shouldConvert) {
        return text;
      }

      let result = "";
      let index = 0;
      let inMath = false;
      let displayMath = false;

      while (index < text.length) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (!inMath && character === "$") {
          if (nextCharacter === "$") {
            inMath = true;
            displayMath = true;
            result += "$$";
            index += 2;
            continue;
          }

          inMath = true;
          displayMath = false;
          result += "$";
          index++;
          continue;
        }

        if (inMath && character === "$") {
          if (displayMath && nextCharacter === "$") {
            inMath = false;
            displayMath = false;
            result += "$$";
            index += 2;
            continue;
          }

          if (!displayMath) {
            inMath = false;
            result += "$";
            index++;
            continue;
          }
        }

        if (!inMath && /[0-9]/.test(character)) {
          result += toPersianDigits(character);
        } else {
          result += character;
        }

        index++;
      }

      return result;
    }

    function normalizePreviewSpacing(text) {
      return text
        .replace(/\r\n/g, "\n")
        .replace(/\n{2,}/g, "\n");
    }

    function readBracedValue(text, startIndex) {
      if (text[startIndex] !== "{") {
        return null;
      }

      let depth = 0;

      for (let index = startIndex; index < text.length; index++) {
        const character = text[index];
        const previousCharacter = text[index - 1];

        if (character === "{" && previousCharacter !== "\\") {
          depth++;
        } else if (character === "}" && previousCharacter !== "\\") {
          depth--;

          if (depth === 0) {
            return {
              value: text.slice(startIndex + 1, index),
              endIndex: index + 1
            };
          }
        }
      }

      return null;
    }

    function wrapSourceFragment(className, sourceStart, sourceEnd, content) {
      return '<span class="' + className + ' preview-source-fragment" data-source-start="' + sourceStart + '" data-source-end="' + sourceEnd + '">' + content + "</span>";
    }

    function appendPreviewTextSegment(text, sourceStart, sourceEnd, isFarsiPreview) {
      if (!text) {
        return "";
      }

      const normalizedText = normalizePreviewSpacing(text);
      const renderedText = escapeHtml(convertDigitsOutsideMath(normalizedText, isFarsiPreview));

      if (!renderedText) {
        return "";
      }

      return wrapSourceFragment("preview-text-segment", sourceStart, sourceEnd, renderedText);
    }

    function renderPreviewContent(text, isFarsiPreview) {
      return escapeHtml(convertDigitsOutsideMath(normalizePreviewSpacing(text), isFarsiPreview));
    }

    function formatPreviewText(text) {
      const commandPattern = /\\(title|author|abstract|section|definition|theorem|english)\s*\{/g;
      let html = "";
      let lastIndex = 0;
      let sectionNumber = 0;
      let definitionNumber = 0;
      let theoremNumber = 0;
      let match;
      const isFarsiPreview = isPreviewFarsi();
      const abstractLabel = isFarsiPreview ? "چکیده" : "Abstract";
      const definitionLabel = isFarsiPreview ? "تعریف" : "Definition";
      const theoremLabel = isFarsiPreview ? "قضیه" : "Theorem";

      while ((match = commandPattern.exec(text)) !== null) {
        const valueStartIndex = commandPattern.lastIndex - 1;
        const bracedValue = readBracedValue(text, valueStartIndex);

        if (!bracedValue) {
          continue;
        }

        html += appendPreviewTextSegment(text.slice(lastIndex, match.index), lastIndex, match.index, isFarsiPreview);

        if (match[1] === "title") {
          html += '<span class="preview-title">' + wrapSourceFragment("preview-title-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else if (match[1] === "author") {
          html += '<span class="preview-author">' + wrapSourceFragment("preview-author-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else if (match[1] === "abstract") {
          html += '<span class="preview-abstract"><span class="preview-abstract-label">' + abstractLabel + "</span>" + wrapSourceFragment("preview-abstract-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else if (match[1] === "section") {
          sectionNumber++;
          definitionNumber = 0;
          theoremNumber = 0;
          const renderedSectionNumber = isFarsiPreview ? toPersianDigits(String(sectionNumber)) : String(sectionNumber);
          html += '<span class="preview-section">' + renderedSectionNumber + ". " + wrapSourceFragment("preview-section-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else if (match[1] === "definition") {
          definitionNumber++;
          const renderedDefinitionNumber = isFarsiPreview ? toPersianDigits(sectionNumber + "." + definitionNumber + ".") : sectionNumber + "." + definitionNumber + ".";
          html += '<span class="preview-statement"><span class="preview-label">' + definitionLabel + " " + renderedDefinitionNumber + "</span> " + wrapSourceFragment("preview-statement-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else if (match[1] === "theorem") {
          theoremNumber++;
          const renderedTheoremNumber = isFarsiPreview ? toPersianDigits(sectionNumber + "." + theoremNumber + ".") : sectionNumber + "." + theoremNumber + ".";
          html += '<span class="preview-statement"><span class="preview-label">' + theoremLabel + " " + renderedTheoremNumber + "</span> " + wrapSourceFragment("preview-statement-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, isFarsiPreview)) + "</span>";
        } else {
          html += '<span class="preview-english">' + wrapSourceFragment("preview-english-content", match.index, bracedValue.endIndex, renderPreviewContent(bracedValue.value, false)) + "</span>";
        }

        lastIndex = bracedValue.endIndex;
        commandPattern.lastIndex = bracedValue.endIndex;
      }

      html += appendPreviewTextSegment(text.slice(lastIndex), lastIndex, text.length, isFarsiPreview);

      return html;
    }

    function renderPreview(options) {
      const shouldTypeset = !options || options.typeset !== false;

    function findPreviewBlockForSourceIndex(sourceIndex) {
      const blocks = preview.querySelectorAll("[data-source-start][data-source-end]");
      let fallback = null;
      let bestMatch = null;
      let bestLength = Infinity;

      for (let index = 0; index < blocks.length; index++) {
        const block = blocks[index];
        const start = Number(block.getAttribute("data-source-start"));
        const end = Number(block.getAttribute("data-source-end"));

        if (!Number.isFinite(start) || !Number.isFinite(end)) {
          continue;
        }

        if (sourceIndex >= start && sourceIndex < end) {
          const length = end - start;
          if (length < bestLength) {
            bestMatch = block;
            bestLength = length;
          }
        }

        if (sourceIndex >= end) {
          fallback = block;
        }
      }

      return bestMatch || fallback || blocks[blocks.length - 1] || null;
    }

    function scrollPreviewToSourceIndex(sourceIndex) {
      const targetBlock = findPreviewBlockForSourceIndex(sourceIndex);

      if (!targetBlock) {
        return null;
      }

      const previewRect = preview.getBoundingClientRect();
      const blockRect = targetBlock.getBoundingClientRect();
      const blockBottom = blockRect.bottom - previewRect.top + preview.scrollTop;
      const desiredTop = Math.max(0, blockBottom - preview.clientHeight + Math.max(24, Math.round(preview.clientHeight * .12)));
      const maxTop = Math.max(0, preview.scrollHeight - preview.clientHeight);

      preview.scrollTop = Math.min(desiredTop, maxTop);
      return targetBlock;
    }

        return;
      }

      const removed = customSamples[index];
      customSamples = customSamples.filter(function (sample) {
        return sample.id !== id;
      });
      saveCustomSamples();

      if (activeSampleKey === removed.key) {
        const fallback = getAllSamples()[0];
        if (fallback) {
          saveActiveSampleKey(fallback.key);
          setEditorContent(fallback.content);
          saveEditorState();
          renderPreview();
        }
      }

      renderSampleList();
    }

    function renderSampleList() {
      sampleList.innerHTML = "";

      const allSamples = getAllSamples();
      if (allSamples.length > 0 && !allSamples.some(function (sample) {
        return sample.key === activeSampleKey;
      })) {
        activeSampleKey = allSamples[0].key;
        localStorage.setItem(activeSampleStorageKey, activeSampleKey);
      }

      allSamples.forEach(function (sample) {
        const row = document.createElement("div");
        row.className = "sample-row";

        const isCustom = sample.key.indexOf("custom-") === 0;

        if (isCustom) {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "sample-delete-button";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", "Delete sample");
          deleteButton.addEventListener("click", function (event) {
            deleteCustomSample(sample.id, event);
          });

          if (sample.locked) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "sample-button";
            button.textContent = sample.label;
            button.dataset.sampleKey = sample.key;
            if (sample.key === activeSampleKey) {
              button.classList.add("active");
            }

            button.addEventListener("click", function () {
              selectSample(sample);
            });

            row.appendChild(button);
          } else {
            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.className = "sample-name-input";
            nameInput.value = sample.label;
            nameInput.setAttribute("aria-label", "Sample name");
            if (sample.key === activeSampleKey) {
              nameInput.classList.add("active");
            }

            nameInput.addEventListener("click", function (event) {
              event.stopPropagation();
            });

            nameInput.addEventListener("keydown", function (event) {
              if (event.key === "Enter") {
                event.preventDefault();
                finalizeCustomSampleName(sample.id, nameInput);
              }
            });

            nameInput.addEventListener("input", function () {
              renameCustomSample(sample.id, nameInput.value);
            });

            row.appendChild(nameInput);
            if (pendingCustomNameFocusId === sample.id) {
              pendingCustomNameFocusId = null;
              requestAnimationFrame(function () {
                nameInput.focus();
                nameInput.select();
              });
            }
          }

          row.appendChild(deleteButton);
        } else {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "sample-button";
          button.textContent = sample.label;
          button.dataset.sampleKey = sample.key;
          if (sample.key === activeSampleKey) {
            button.classList.add("active");
          }

          button.addEventListener("click", function () {
            selectSample(sample);
          });

          button.style.gridColumn = "1 / -1";

          row.appendChild(button);
        }

        sampleList.appendChild(row);
      });
    }

    function insertAtCursor(text) {
      const value = editor.value;
      const hasSelection = typeof editor.selectionStart === "number" && typeof editor.selectionEnd === "number";
      const useCurrentSelection = document.activeElement === editor && hasSelection;
      const start = useCurrentSelection ? editor.selectionStart : lastEditorSelectionStart;
      const end = useCurrentSelection ? editor.selectionEnd : lastEditorSelectionEnd;

      if (typeof start === "number" && typeof end === "number") {
        editor.setRangeText(text, start, end, "end");
        lastEditorSelectionStart = editor.selectionStart;
        lastEditorSelectionEnd = editor.selectionEnd;
        return;
      }

      const needsSeparator = value.length > 0 && !/[\s]$/.test(value);
      editor.value = value + (needsSeparator ? " " : "") + text;
      editor.selectionStart = editor.selectionEnd = editor.value.length;
      lastEditorSelectionStart = editor.selectionStart;
      lastEditorSelectionEnd = editor.selectionEnd;
    }

    function closeSymbolPicker() {
      symbolPicker.hidden = true;
      symbolToggleButton.setAttribute("aria-expanded", "false");
    }

    function openSymbolPicker() {
      symbolPicker.hidden = false;
      symbolToggleButton.setAttribute("aria-expanded", "true");
    }

    function toggleSymbolPicker() {
      if (symbolPicker.hidden) {
        openSymbolPicker();
      } else {
        closeSymbolPicker();
      }
    }

    symbolToggleButton.setAttribute("aria-expanded", "false");

    symbolItems.forEach(function (item) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "symbol-item";
      button.textContent = item.label;
      button.title = item.title;
      button.setAttribute("aria-label", item.title);
      button.addEventListener("pointerdown", function (event) {
        event.preventDefault();
      });
      button.addEventListener("click", function () {
        insertAtCursor(item.insert);
        editor.focus();
        closeSymbolPicker();
      });
      symbolPicker.appendChild(button);
    });

    document.getElementById("MathJax-script").addEventListener("load", renderPreview);
    restoreActiveSampleKey();
    renderSampleList();
    const savedEditorState = loadEditorState();
    if (savedEditorState) {
      const savedSample = getAllSamples().find(function (sample) {
        return sample.key === savedEditorState.activeSampleKey;
      });

      if (savedSample) {
        saveActiveSampleKey(savedSample.key);
        editor.value = savedEditorState.content;

        if (savedSample.key.indexOf("custom-") === 0) {
          customSamples = customSamples.map(function (sample) {
            if (sample.key !== savedSample.key) {
              return sample;
            }

            return {
              id: sample.id,
              key: sample.key,
              label: sample.label,
              content: savedEditorState.content,
              locked: sample.locked
            };
          });
          saveCustomSamples();
        }
      }
    }
    renderSampleList();
    renderPreview();
    addSampleButton.addEventListener("click", function () {
      addCurrentSample();
    });
    symbolToggleButton.addEventListener("click", function (event) {
      event.stopPropagation();
      toggleSymbolPicker();
    });
    symbolPicker.addEventListener("click", function (event) {
      event.stopPropagation();
    });
    document.addEventListener("click", function () {
      closeSymbolPicker();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeSymbolPicker();
      }
    });
    sidebarTitle.addEventListener("pointerdown", function (event) {
      if (event.target.closest("button, input, textarea, select, a, label")) {
        return;
      }

      event.preventDefault();
      sidebarDragState = {
        offsetX: event.clientX - sidebar.getBoundingClientRect().left,
        offsetY: event.clientY - sidebar.getBoundingClientRect().top
      };
      sidebarTitle.setPointerCapture(event.pointerId);
      document.body.classList.add("is-dragging-sidebar");
    });
    sidebarTitle.addEventListener("pointermove", function (event) {
      if (!sidebarTitle.hasPointerCapture(event.pointerId) || !sidebarDragState) {
        return;
      }

      applySidebarPosition(event.clientX - sidebarDragState.offsetX, event.clientY - sidebarDragState.offsetY);
    });
    function endSidebarDrag(event) {
      if (sidebarTitle.hasPointerCapture(event.pointerId)) {
        sidebarTitle.releasePointerCapture(event.pointerId);
      }

      sidebarDragState = null;
      document.body.classList.remove("is-dragging-sidebar");
    }
    sidebarTitle.addEventListener("pointerup", endSidebarDrag);
    sidebarTitle.addEventListener("pointercancel", endSidebarDrag);
    updatePreviewButton.addEventListener("click", saveCurrentSample);
    editor.addEventListener("input", function () {
      rememberEditorSelection();
      if (activeSampleKey.indexOf("custom-") === 0) {
        customSamples = customSamples.map(function (sample) {
          if (sample.key !== activeSampleKey) {
            return sample;
          }

          return {
            id: sample.id,
            key: sample.key,
            label: sample.label,
            content: editor.value,
            locked: sample.locked
          };
        });
        saveCustomSamples();
      }

      saveEditorState();
    });
    editor.addEventListener("keyup", rememberEditorSelection);
    editor.addEventListener("click", rememberEditorSelection);
    editor.addEventListener("mouseup", rememberEditorSelection);
    editor.addEventListener("select", rememberEditorSelection);
    editor.addEventListener("focus", rememberEditorSelection);
    editor.addEventListener("touchend", rememberEditorSelection);
    document.addEventListener("selectionchange", function () {
      if (document.activeElement === editor) {
        rememberEditorSelection();
      }
    });
    document.addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && (event.key.toLowerCase() === "s" || event.code === "KeyS")) {
        event.preventDefault();
        saveCurrentSample();
      }
    });
    savePdfButton.addEventListener("click", function () {
      clearTimeout(renderTimer);
      saveCurrentSample();
      renderPreview({ typeset: false });
      document.body.classList.add("printing-pdf");

      function clearPrintMode() {
        document.body.classList.remove("printing-pdf");
      }

      window.addEventListener("afterprint", clearPrintMode, { once: true });

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([preview]).then(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              window.print();
            });
          });
        });
      } else {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.print();
          });
        });
      }
    });
    if (previewLanguage !== "fa" && previewLanguage !== "en") {
      previewLanguage = activeSampleKey === "farsi" ? "fa" : "en";
      localStorage.setItem(previewLanguageStorageKey, previewLanguage);
    }
    syncPreviewLanguageButton();
    syncEditorDirection();
    syncMobileView();
    renderPreview();
    restoreSidebarPosition();
    setSidebarCollapsed(isSidebarCollapsed());
    previewLanguageButton.addEventListener("click", function (event) {
      event.stopPropagation();
      setPreviewLanguage(previewLanguage === "fa" ? "en" : "fa");
    });
    mobileEditorTab.addEventListener("click", function () {
      setMobileView("editor");
    });
    mobilePreviewTab.addEventListener("click", function () {
      setMobileView("preview");
    });
    sidebarCollapseButton.addEventListener("click", function (event) {
      event.stopPropagation();
      setSidebarCollapsed(!sidebar.classList.contains("collapsed"));
    });

    splitter.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      splitter.setPointerCapture(event.pointerId);
      document.body.classList.add("is-resizing");
    });

    splitter.addEventListener("pointermove", function (event) {
      if (!splitter.hasPointerCapture(event.pointerId)) {
        return;
      }

      const bounds = workspace.getBoundingClientRect();
      const editorWidth = setPaneWidths(event.clientX - bounds.left);

      localStorage.setItem(editorWidthStorageKey, editorWidth);
    });

    splitter.addEventListener("pointerup", function (event) {
      if (splitter.hasPointerCapture(event.pointerId)) {
        splitter.releasePointerCapture(event.pointerId);
      }

      document.body.classList.remove("is-resizing");
    });

    splitter.addEventListener("pointercancel", function (event) {
      if (splitter.hasPointerCapture(event.pointerId)) {
        splitter.releasePointerCapture(event.pointerId);
      }

      document.body.classList.remove("is-resizing");
    });

    window.addEventListener("resize", restorePaneWidths);
    window.addEventListener("resize", syncMobileView);
    restorePaneWidths();
  </script>
</body>

</html>
